<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#F7C8D4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="待会吃什么">
<title>待会吃什么</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css">
<script>
/* 首屏就判定是否「独立 App 模式」（加到主屏后从图标启动）——必须在渲染前设置，
   否则任务栏会先按 Safari 模式渲染再跳一下。
   两处差别：
     1. 独立模式下视口已经包含 Home Indicator 区，再加 safe-area 内边距会把
        任务栏顶上去、看起来"悬空一格"，所以要去掉那 13px。
     2. 浏览器/Safari 模式底部有工具栏，必须留出安全区。 */
(function () {
  var sa = 0;
  try {
    if (window.navigator.standalone === true) sa = 1;
    else if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) sa = 1;
    else if (window.matchMedia && window.matchMedia('(display-mode: fullscreen)').matches) sa = 1;
  } catch (e) {}
  document.documentElement.setAttribute('data-standalone', sa ? '1' : '0');
})();
</script>
</head>
<body>
<div id="app"></div>
<script src="core.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
